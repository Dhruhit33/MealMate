name: MealMate CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend-only
          - backend-only
          - infra-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  S3_BUCKET: ${{ vars.S3_BUCKET_NAME || 'mealmate-frontend-demo-build' }}
  ASG_NAME: 'mealmate-asg'
  K8S_NAMESPACE: 'mealmate'

jobs:
  # ============================================================================
  # 1. SECURITY & SECRET AUDIT
  # ============================================================================
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Hardcoded Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

      - name: Run Trivy Security Vulnerability Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
        continue-on-error: true

  # ============================================================================
  # 2. TERRAFORM INFRASTRUCTURE CHECKS
  # ============================================================================
  terraform-check:
    name: Terraform Validation & IaC Security
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_target == null || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'infra-only'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Check Terraform Formatting
        working-directory: infra/envs/demo
        run: terraform fmt -check

      - name: Initialize Terraform (No Backend)
        working-directory: infra/envs/demo
        run: terraform init -backend=false

      - name: Validate Terraform Syntax & References
        working-directory: infra/envs/demo
        run: terraform validate

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/'
          severity: 'CRITICAL,HIGH'
          format: 'table'
        continue-on-error: true

  # ============================================================================
  # 3. FRONTEND CI/CD (Test, Build, S3 Sync & CloudFront Invalidation)
  # ============================================================================
  frontend-ci-cd:
    name: Frontend CI/CD (Vite/React -> S3)
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_target == null || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'frontend-only'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: npm run build

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Static Assets to AWS S3 Bucket
        if: github.ref == 'refs/heads/main'
        run: |
          echo "==> Deploying Vite build to S3: s3://${{ env.S3_BUCKET }}..."
          aws s3 sync frontend/dist "s3://${{ env.S3_BUCKET }}" --delete
          echo "✅ S3 static website sync completed."

      - name: Invalidate CloudFront CDN Cache (Optional)
        if: github.ref == 'refs/heads/main'
        env:
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CF_DIST_ID" ]; then
            echo "==> Invalidating CloudFront cache for distribution: $CF_DIST_ID..."
            aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/*"
            echo "✅ CloudFront invalidation triggered."
          else
            echo "ℹ️ CLOUDFRONT_DISTRIBUTION_ID not set, skipping CDN invalidation."
          fi

  # ============================================================================
  # 4. BACKEND MICROSERVICES CI/CD (Maven, Docker, Trivy, ECR)
  # ============================================================================
  backend-ci-cd:
    name: Build & Push Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_target == null || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'backend-only'
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - delivery-service
          - discovery-server
          - notification-service
          - order-service
          - payment-service
          - restaurant-service
          - user-service
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & Test Service Code
        working-directory: Backened/${{ matrix.service }}
        run: |
          echo "==> Compiling service and validating tests..."
          mvn clean test-compile -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: mealmate-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${REPO_NAME}"
          echo "==> Building and tagging image: ${IMAGE_URI}:${IMAGE_TAG}..."
          
          docker build \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            "Backened/${{ matrix.service }}"
          
          echo "==> Pushing image to AWS ECR..."
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "✅ Docker image pushed to ECR: ${IMAGE_URI}:${IMAGE_TAG}"

      - name: Scan ECR Image for Vulnerabilities (Trivy)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/mealmate-${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

  # ============================================================================
  # 5. KUBERNETES ROLLING DEPLOYMENT & HEALTH VERIFICATION
  # ============================================================================
  k8s-deploy:
    name: Kubernetes Deploy & Rollout Verification
    runs-on: ubuntu-latest
    needs: [backend-ci-cd, frontend-ci-cd]
    if: github.ref == 'refs/heads/main' && (github.event.inputs.deploy_target == null || github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'backend-only')
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Updated Images to Kubernetes (k3s via AWS SSM)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "==> Locating EC2 instance in Auto Scaling Group: ${{ env.ASG_NAME }}..."
          INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" \
            --output text 2>/dev/null || echo "")

          # Resilient fallback: lookup running instance by ASG tag via EC2
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "ℹ️ ASG query returned empty, querying by ASG tag..."
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:aws:autoscaling:groupName,Values=${{ env.ASG_NAME }}" "Name=instance-state-name,Values=running" \
              --region "${{ env.AWS_REGION }}" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: No running instance found in Auto Scaling Group ${{ env.ASG_NAME }}!"
            exit 1
          fi

          echo "✅ Found EC2 instance: $INSTANCE_ID"

          # Retrieve temporary ECR authentication token to allow k3s to pull private ECR images
          ECR_PASSWORD=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")

          # Create a self-contained shell script for zero-downtime rolling update
          cat << 'SCRIPT_EOF' > deploy_k8s.sh
set -e
echo "==> Ensuring ECR pull secret in namespace ${{ env.K8S_NAMESPACE }}..."
k3s kubectl create secret docker-registry ecr-secret \
  --docker-server="${{ steps.login-ecr.outputs.registry }}" \
  --docker-username="AWS" \
  --docker-password="${ECR_PASSWORD}" \
  --namespace="${{ env.K8S_NAMESPACE }}" \
  --dry-run=client -o yaml | k3s kubectl apply -f -

k3s kubectl patch serviceaccount default -n "${{ env.K8S_NAMESPACE }}" -p '{"imagePullSecrets": [{"name": "ecr-secret"}]}' 2>/dev/null || true

SERVICES="api-gateway config-server delivery-service discovery-server notification-service order-service payment-service restaurant-service user-service"

echo "==> Starting zero-downtime rolling update for microservices..."
for svc in $SERVICES; do
  IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/mealmate-${svc}:${{ github.sha }}"
  k3s kubectl patch deployment "${svc}" -n "${{ env.K8S_NAMESPACE }}" -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ecr-secret"}]}}}}' 2>/dev/null || true
  k3s kubectl set image deployment/"${svc}" "${svc}=${IMAGE_URI}" -n "${{ env.K8S_NAMESPACE }}" || true
done

echo "==> Verifying rolling update statuses..."
for svc in $SERVICES; do
  echo "Checking rollout status for ${svc}..."
  if ! k3s kubectl rollout status deployment/"${svc}" -n "${{ env.K8S_NAMESPACE }}" --timeout=120s; then
    echo "❌ Rollout check failed for ${svc}! Rolling back to previous healthy state..."
    k3s kubectl rollout undo deployment/"${svc}" -n "${{ env.K8S_NAMESPACE }}"
    exit 1
  fi
done

echo "==> Final pod statuses in namespace ${{ env.K8S_NAMESPACE }}:"
k3s kubectl get pods -n "${{ env.K8S_NAMESPACE }}"
SCRIPT_EOF

          B64_SCRIPT=$(base64 -w 0 deploy_k8s.sh)

          echo "==> Dispatching deployment command via AWS SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64_SCRIPT | base64 -d | bash\"]" \
            --region "${{ env.AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "==> SSM Command sent: $COMMAND_ID. Awaiting execution..."

          # Poll for command completion
          STATUS="Pending"
          while [ "$STATUS" == "Pending" ] || [ "$STATUS" == "InProgress" ] || [ "$STATUS" == "Delayed" ]; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "${{ env.AWS_REGION }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Current status: $STATUS"
          done

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "${{ env.AWS_REGION }}" \
            --query "StandardOutputContent" \
            --output text)
          
          echo "=========================================="
          echo "   Kubernetes Deployment Output           "
          echo "=========================================="
          echo "$OUTPUT"

          if [ "$STATUS" != "Success" ]; then
            ERROR_OUTPUT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "${{ env.AWS_REGION }}" \
              --query "StandardErrorContent" \
              --output text)
            echo "❌ Deployment execution failed: $ERROR_OUTPUT"
            exit 1
          fi

          echo "🎉 All Kubernetes microservices rolled out and verified successfully!"
