<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="mmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A50"/>
      <stop offset="55%" stop-color="#C0401E"/>
      <stop offset="100%" stop-color="#8B2910"/>
    </linearGradient>
    <linearGradient id="mmShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="mmDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8B2910" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Icon Mark -->
  <g transform="translate(6, 6)" filter="url(#mmDrop)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#mmBgGrad)"/>
    <rect x="0" y="0" width="48" height="24" rx="14" fill="url(#mmShine)"/>
    
    <!-- Sparkle crown -->
    <path d="M24 8.5C24 9.8 23.2 10.6 22.2 11.5C23.2 12.4 24 13.2 24 14.5C24 13.2 24.8 12.4 25.8 11.5C24.8 10.6 24 9.8 24 8.5Z" fill="#FFE5D0"/>
    <!-- Double-arch Cloche 'M' -->
    <path d="M12.5 34V22.5C12.5 18.5 15.2 15.8 19 15.8C21.4 15.8 23.2 17.2 24 19.2C24.8 17.2 26.6 15.8 29 15.8C32.8 15.8 35.5 18.5 35.5 22.5V34" stroke="#FFF5E6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Companion smile plate curve -->
    <path d="M17.5 35.2C19.5 37.2 21.6 37.8 24 37.8C26.4 37.8 28.5 37.2 30.5 35.2" stroke="#FFD5BE" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="38" font-family="'Instrument Serif', Georgia, serif" font-size="34" font-weight="600" fill="#1C1208" letter-spacing="-0.5">Meal<tspan fill="#C0401E" font-weight="700">Mate</tspan><tspan fill="#C0401E">.</tspan></text>
</svg>
