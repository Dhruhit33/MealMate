apiVersion: v1
kind: ConfigMap
metadata:
  name: mealmate-config
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate
data:
  # Spring Cloud URLs
  CONFIG_SERVER_URL: "http://config-server:8888"
  SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
  SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS: "20"
  SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: "2000"
  EUREKA_URL: "http://discovery-server:8761/eureka/"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"

  # Database and Caching
  DB_HOST: "mysql"
  DB_PORT: "3306"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Event Bus
  KAFKA_BOOTSTRAP: "kafka:9092"
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

  # JVM Optimization (ensures fast startup and low memory footprint)
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

  # Spring Boot Kubernetes Health Probes
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

  # JWT Expiration
  JWT_EXPIRATION: "86400000"

  # Driver Matching Radius (25 km coverage)
  DELIVERY_MATCHING_RADIUS_KM: "25.0"
  DELIVERY_MATCHING_RETRY_RADIUS_KM: "25.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate
data:
  01-init-databases.sql: |
    CREATE DATABASE IF NOT EXISTS user_db;
    CREATE DATABASE IF NOT EXISTS restaurant_db;
    CREATE DATABASE IF NOT EXISTS order_db;
    CREATE DATABASE IF NOT EXISTS payment_db;
    CREATE DATABASE IF NOT EXISTS delivery_db;
    CREATE DATABASE IF NOT EXISTS notification_db;
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;
