apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: mealmate
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
              name: client
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms48m -Xmx96m"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-XX:+UseSerialGC"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: mealmate
  labels:
    app: zookeeper
spec:
  ports:
    - port: 2181
      targetPort: 2181
      name: client
  selector:
    app: zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: mealmate
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:

kind: Service
metadata:
  name: kafka
  namespace: mealmate
  labels:
    app: kafka
spec:
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
  selector:
    app: kafka
