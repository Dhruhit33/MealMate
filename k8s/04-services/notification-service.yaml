apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: mealmate
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/dhruhit33/mealmate-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - configMapRef:
                name: mealmate-config
            - secretRef:
                name: mealmate-secrets
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "384Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 25
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: mealmate
  labels:
    app: notification-service
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: http
  selector:
    app: notification-service
