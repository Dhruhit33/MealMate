apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealmate-ingress
  namespace: mealmate
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Frontend SPA (UI)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # REST APIs to Spring Cloud API Gateway
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          # Real-time WebSocket (Delivery tracking)
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
