apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealmate-ingress
  namespace: mealmate
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          # Frontend SPA (UI)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # REST APIs to Spring Cloud API Gateway
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

          # Real-time WebSocket (Delivery tracking)
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
